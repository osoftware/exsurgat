<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href='https://fonts.googleapis.com/css?family=Crimson+Text:400,700,700italic,400italic' rel='stylesheet' type='text/css'>
  <script src="https://cecile.orb.net.pl/app-assets/js/exsurge.min.js"></script>
  <!-- <script src="playback.js"></script> -->
  <script type="text/javascript">
    let context = new exsurge.ChantContext();
    let score;
    let setChant = function(gabc) {
      var mappings = exsurge.Gabc.createMappingsFromSource(context, gabc);
      score = new exsurge.ChantScore(context, mappings, true);
    };
    let renderChant = function(width) {
      // perform layout on the chant
      score.performLayoutAsync(context, function() {
        score.layoutChantLines(context, width, function() {
          var svgNode = document.createElement('div');
          var svg = score.createSvgNode(context);
          document.getElementById("sheet").innerHTML = svg.outerHTML;
        });
      });
    };
    Ready.postMessage("ready");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      /* background-color: #aaa; */
    }
  </style>
</head>
<body>
  <div id="sheet"></div>
</body>
</html>
